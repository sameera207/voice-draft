name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Check VERSION matches the tag
        run: |
          VERSION="$(cat VERSION)"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::VERSION file ($VERSION) does not match tag ($TAG)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build tarball
        run: |
          git archive --format=tar.gz --prefix="voice-draft-$VERSION/" \
            -o "voice-draft-$VERSION.tar.gz" HEAD
          echo "SHA256=$(sha256sum "voice-draft-$VERSION.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Create GitHub release
        run: |
          gh release create "$TAG" "voice-draft-$VERSION.tar.gz" \
            --title "voice-draft $VERSION" --generate-notes

      - name: Update Homebrew tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:sameera207/homebrew-tap.git tap
          mkdir -p tap/Formula
          sed -e "s/@VERSION@/$VERSION/g" -e "s/@SHA256@/$SHA256/g" \
            packaging/homebrew/voice-draft.rb > tap/Formula/voice-draft.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/voice-draft.rb
          git commit -m "voice-draft $VERSION"
          git push
