name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: brew install lua lua@5.4 shellcheck

      - name: Syntax check (Lua 5.4 and 5.5)
        run: |
          L54="$(brew --prefix lua@5.4)/bin"
          for f in hammerspoon/dictation/*.lua; do
            "$L54/luac" -p "$f"
            luac -p "$f"
          done

      - name: Unit tests (Lua 5.4, as shipped in Hammerspoon)
        run: |
          for t in tests/*_spec.lua; do "$(brew --prefix lua@5.4)/bin/lua" "$t"; done

      - name: Unit tests (Lua 5.5)
        run: |
          for t in tests/*_spec.lua; do lua "$t"; done

      - name: shellcheck
        run: shellcheck bin/voice-draft install.sh

      - name: CLI smoke test
        run: |
          bin/voice-draft version
          bin/voice-draft help
